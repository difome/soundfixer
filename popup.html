<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">

<div id="elements-pane">
	<header>
		<div>
			<h1>SoundFixer</h1>
			<div class="fork-info">Chrome/Edge port of <a href="https://github.com/valpackett/soundfixer" target="_blank">original Firefox extension</a></div>
		</div>
		<a href="https://buymeacoffee.com/n6223221" class="info-opener" target="_blank"><img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="" title="Buy me a coffee" style="height: 1.8rem; width: auto;"></a>
		<a href="https://patreon.com/valpackett" class="info-opener" target="_blank"><img src="patreon.svg" alt="" title="Support original author on Patreon"></a>
		<a href="https://github.com/difome/soundfixer" class="info-opener" target="_blank"><img src="github.svg" alt="" title="View Chrome/Edge fork on GitHub"></a>
	</header>
	<template id="elements-tpl">
			<div class="header-row">
				<div class="element-label"></div>
				<button class="element-reset">Reset</button>
			</div>
			<label>
				<span>Gain</span>
				<input type="range" class="element-gain" min="0" max="5" step="0.05" />
				<input type="number" class="element-gain-num" value="1" min="0" max="69" step="0.05">
			</label>
			<label>
				<span>Pan</span>
				<input type="range" class="element-pan" min="-1" max="1" step="0.05" />
				<input type="number" class="element-pan-num" value="0" min="-1" max="1" step="0.05">
			</label>
			<div class="checkboxes">
				<label>
					<span>Mono</span>
					<input type="checkbox" class="element-mono" />
				</label>
				<label>
					<span>Flip L/R</span>
					<input type="checkbox" class="element-flip" />
				</label>
			</div>
	</template>
	<div id="all-elements">
	</div>
	<details id="individual-elements">
		<summary>Control individual media elements</summary>
		<ul id="elements-list">
		</ul>
	</details>
	<p class="info">
		Note: if you get silence after touching a control, that means this extension can't do anything on this site
		because the site uses cross-domain media. Because Security™ :(
	</p>
</div>

<script src="popup.js"></script>
